name: Evals

# Runs the scenario evals (scripts/run-evals.sh) in a real agent. They cost real usage, so this is
# manual only (workflow_dispatch), never on push or pull_request, and it does nothing unless the
# ANTHROPIC_API_KEY secret is set. It never runs on a fork. Every call has a budget, and the whole
# run has a cost cap: the runner starts no call once the cap is spent.
on:
  workflow_dispatch:
    inputs:
      budget_per_call:
        description: Most one agent call may spend, in USD
        default: "1"
      max_total:
        description: Most the whole run may spend, in USD
        default: "3"
      scenarios:
        description: Scenario names, space-separated (empty runs every scenario)
        default: ""

permissions:
  contents: read

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  evals:
    # A fork has no use for this: its secrets are its own, and the cost would be someone else's.
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the API key is set
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY is not set: skipping the evals."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.enabled == 'true'
        with:
          persist-credentials: false
      # The API key is not in the environment of this step: only the run step below sees it.
      - name: Install the claude CLI
        if: steps.key.outputs.enabled == 'true'
        run: npm install --global @anthropic-ai/claude-code
      - name: Run the scenario evals
        if: steps.key.outputs.enabled == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_BUDGET_USD: ${{ inputs.budget_per_call }}
          EVAL_MAX_TOTAL_USD: ${{ inputs.max_total }}
          SCENARIOS: ${{ inputs.scenarios }}
        run: |
          # Inputs arrive as env vars, never spliced into the script; the runner rejects non-numbers.
          # shellcheck disable=SC2086
          bash scripts/run-evals.sh $SCENARIOS
