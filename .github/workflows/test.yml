name: Test

# Validates every skills/*/SKILL.md, runs the scripts' own tests, and checks the
# skills' example log lines against the platform's live log schemas.
# Needs only Bash and Python 3, both on ubuntu-latest.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/test-validate-skills.sh
      - run: bash scripts/validate-skills.sh
      - run: bash scripts/test-check-log-contract.sh
      - run: bash scripts/test-hook.sh
      - run: bash scripts/test-check-skill-invariants.sh
      - run: bash scripts/check-skill-invariants.sh
      # The platform owns the log format: every example log line in a SKILL.md must
      # parse against the live schemas, and every scope or value a skill writes must be
      # one the platform documents, so the two repos can't drift apart unnoticed.
      - name: Check example log lines and logged values against the live log-schemas.json
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/log-schemas.json" https://adamsuk.github.io/viva/log-schemas.json
          bash scripts/check-log-contract.sh "$RUNNER_TEMP/log-schemas.json"
          bash scripts/check-skill-invariants.sh skills "$RUNNER_TEMP/log-schemas.json"
