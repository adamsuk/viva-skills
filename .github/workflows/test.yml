name: Test

# Validates every skills/*/SKILL.md and runs the validator's own tests.
# Needs only Bash and Python 3, both on ubuntu-latest.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/test-validate-skills.sh
      - run: bash scripts/validate-skills.sh
